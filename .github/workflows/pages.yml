name: Pages

# Publishes the project datasheet (docs/datasheet/) to GitHub Pages, so the
# link in the README opens for anyone. It deploys whenever the page changes
# on main; nothing else about the site is built.

on:
  push:
    branches: [main]
    paths:
      - 'docs/datasheet/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/datasheet
      - id: deployment
        uses: actions/deploy-pages@v5
