name: Build one image
description: Builds one image from tools/isa and pushes it under its content key (scripts/images.mjs).

inputs:
  name:
    description: The image, as scripts/images.mjs names it.
    required: true
  heavy:
    description: Whether it compiles LLVM and needs the runner's disk cleared first.
    default: 'false'
  token:
    description: A token that can push to the registry.
    required: true

runs:
  using: composite
  steps:
    - name: Make room
      if: inputs.heavy == 'true'
      shell: bash
      # An LLVM build to WebAssembly needs tens of gigabytes the hosted
      # runner's preinstalled SDKs are sitting on.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        docker system prune -af > /dev/null
        df -h /
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - shell: bash
      run: node scripts/images.mjs build "${{ inputs.name }}"
