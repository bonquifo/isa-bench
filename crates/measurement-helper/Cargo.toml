[package]
name = "measurement-helper"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "measurement_helper"
path = "src/lib.rs"

[[bin]]
name = "measurement-helper"
path = "src/main.rs"

[[bin]]
name = "measurement-test-fixture"
path = "src/bin/measurement_test_fixture.rs"
required-features = ["test-only-fixture"]

[features]
test-only-fixture = []

[dependencies]
base64 = "0.23.1"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Performance", "Win32_System_Threading", "Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_SystemInformation"] }
